# Render blueprint: PostgreSQL + Fastify API.
# The API is the Mode A external backend for the Cloudflare Pages/Workers frontend.
# Set secrets in the Render dashboard (or let Render generate them); never commit real values.

databases:
  - name: refurbcompare-db
    databaseName: refurbcompare
    user: refurbcompare
    plan: free
    ipAllowList: []
    postgresMajorVersion: 16

services:
  - type: web
    name: refurbcompare-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run api:start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: live
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_DRIVER
        value: prisma
      - key: DATABASE_URL
        fromDatabase:
          name: refurbcompare-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: refurbcompare-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        value: ""
      - key: QUEUE_DRIVER
        value: memory
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_MAX
        value: "300"