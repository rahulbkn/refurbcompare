name: "Audit: Production DB Ground Truth"

on:
  workflow_dispatch:

jobs:
  audit:
    name: "Read-only production audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          echo "psql installed: $(psql --version)"

      - name: Run audit
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          chmod +x scripts/audit-prod-db.sh
          bash scripts/audit-prod-db.sh
